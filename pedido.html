<!DOCTYPE html>
<html lang="pt-BR">

<head>

<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width, initial-scale=1.0">

<title>Finalizar Pedido - Pastelaria El Shaddai</title>

<style>

* {
    box-sizing: border-box;
}

body {

    margin: 0;

    font-family: Arial, Helvetica, sans-serif;

    background: #fff8e1;

    color: #222;

}


/* =====================================
   CABEÇALHO
===================================== */

header {

    background: linear-gradient(
        135deg,
        #e53935,
        #ffb300
    );

    color: white;

    text-align: center;

    padding: 25px 20px;

    box-shadow:
        0 3px 10px rgba(0,0,0,0.15);

}


header h1 {

    margin: 0 0 8px;

    font-size: 28px;

}


header p {

    margin: 0;

    font-size: 16px;

}


/* =====================================
   CONTAINER
===================================== */

.container {

    width: 92%;

    max-width: 600px;

    margin: 25px auto;

    background: #ffffff;

    border-radius: 18px;

    padding: 22px;

    box-shadow:
        0 5px 20px rgba(0,0,0,0.12);

    border: 2px solid #ffb300;

}


/* =====================================
   TÍTULOS
===================================== */

h2 {

    color: #d84315;

    margin-top: 10px;

}


h3 {

    color: #e65100;

}


/* =====================================
   CAMPOS
===================================== */

.grupo {

    margin-bottom: 18px;

}


.grupo label {

    display: block;

    font-weight: bold;

    margin-bottom: 7px;

}


input,
textarea,
select {

    width: 100%;

    padding: 13px;

    border: 1px solid #ccc;

    border-radius: 9px;

    font-size: 16px;

    outline: none;

    background: #fffdf7;

}


input:focus,
textarea:focus,
select:focus {

    border-color: #ffb300;

    box-shadow:
        0 0 0 2px rgba(255,179,0,0.15);

}


textarea {

    min-height: 90px;

    resize: vertical;

}


/* =====================================
   ENTREGA / RETIRADA
===================================== */

.opcoes {

    display: flex;

    gap: 10px;

}


.opcao {

    flex: 1;

    border: 2px solid #ddd;

    border-radius: 10px;

    padding: 13px;

    text-align: center;

    cursor: pointer;

}


.opcao input {

    width: auto;

    margin-right: 5px;

}


/* =====================================
   ENDEREÇO
===================================== */

#areaEndereco {

    margin-top: 15px;

}


/* =====================================
   RESUMO DO PEDIDO
===================================== */

.resumo {

    margin-top: 25px;

    padding: 18px;

    background: #fff8e1;

    border: 1px solid #ffcc80;

    border-radius: 12px;

}


.resumo h3 {

    margin-top: 0;

}


#listaPedido {

    line-height: 1.6;

}


.total {

    font-size: 22px;

    font-weight: bold;

    color: #d84315;

    margin-top: 15px;

}


/* =====================================
   BOTÃO
===================================== */

.botao-enviar {

    width: 100%;

    padding: 16px;

    margin-top: 20px;

    border: none;

    border-radius: 10px;

    background: linear-gradient(
        135deg,
        #e53935,
        #ffb300
    );

    color: white;

    font-size: 18px;

    font-weight: bold;

    cursor: pointer;

}


.botao-enviar:active {

    transform: scale(0.98);

}


/* =====================================
   VOLTAR
===================================== */

.botao-voltar {

    width: 100%;

    padding: 13px;

    margin-top: 10px;

    border: 1px solid #ddd;

    border-radius: 10px;

    background: white;

    color: #555;

    font-size: 16px;

    cursor: pointer;

}

</style>

</head>


<body>


<header>

<h1>Pastelaria El Shaddai</h1>

<p>Feito a dois, no ponto pra você!</p>

</header>


<div class="container">


<h2>Finalizar Pedido</h2>


<!-- =====================================
     DADOS DO CLIENTE
===================================== -->

<h3>Dados do cliente</h3>


<div class="grupo">

<label for="nome">
Nome
</label>

<input
type="text"
id="nome"
placeholder="Seu nome"
>

</div>


<div class="grupo">

<label for="telefone">
Telefone
</label>

<input
type="tel"
id="telefone"
placeholder="Seu telefone"
>

</div>


<!-- =====================================
     ENTREGA / RETIRADA
===================================== -->

<h3>
Como deseja receber?
</h3>


<div class="opcoes">


<label class="opcao">

<input
type="radio"
name="tipo"
value="Entrega"
checked
onchange="mostrarEndereco()"
>

Entrega

</label>


<label class="opcao">

<input
type="radio"
name="tipo"
value="Retirada"
onchange="mostrarEndereco()"
>

Retirada

</label>


</div>


<!-- =====================================
     ENDEREÇO
===================================== -->

<div id="areaEndereco">


<h3>
Endereço de entrega
</h3>


<div class="grupo">

<label for="rua">
Rua
</label>

<input
type="text"
id="rua"
placeholder="Nome da rua"
>

</div>


<div class="grupo">

<label for="numero">
Número
</label>

<input
type="text"
id="numero"
placeholder="Número"
>

</div>


<div class="grupo">

<label for="complemento">
Complemento
</label>

<input
type="text"
id="complemento"
placeholder="Casa, apartamento, bloco..."
>

</div>


<div class="grupo">

<label for="referencia">
Ponto de referência
</label>

<input
type="text"
id="referencia"
placeholder="Ex.: perto da praça"
>

</div>


<div class="grupo">

<label for="bairro">
Bairro
</label>

<input
type="text"
id="bairro"
placeholder="Seu bairro"
>

</div>


</div>


<!-- =====================================
     OBSERVAÇÕES
===================================== -->

<div class="grupo">

<label for="observacao">
Observações
</label>

<textarea
id="observacao"
placeholder="Alguma observação sobre seu pedido?"
></textarea>

</div>


<!-- =====================================
     RESUMO
===================================== -->

<div class="resumo">

<h3>
Resumo do pedido
</h3>


<div id="listaPedido">
Carregando pedido...
</div>


<div
class="total"
id="totalPedido">

Total: R$ 0,00

</div>

</div>


<!-- =====================================
     BOTÕES
===================================== -->

<button
class="botao-enviar"
onclick="enviarPedido()">

Enviar pedido pelo WhatsApp

</button>


<button
class="botao-voltar"
onclick="window.location.href='index.html'">

Voltar para o cardápio

</button>


</div>


<script>


// ==========================================
// CARRINHO
// ==========================================

let carrinho =
JSON.parse(
localStorage.getItem("carrinho")
) || [];


// ==========================================
// MOSTRAR / ESCONDER ENDEREÇO
// ==========================================

function mostrarEndereco() {

    let tipo =
    document.querySelector(
        'input[name="tipo"]:checked'
    ).value;


    let area =
    document.getElementById(
        "areaEndereco"
    );


    if (tipo === "Entrega") {

        area.style.display = "block";

    } else {

        area.style.display = "none";

    }

}


// ==========================================
// MOSTRAR RESUMO
// ==========================================

function mostrarResumo() {

    let lista =
    document.getElementById(
        "listaPedido"
    );


    let total = 0;


    if (carrinho.length === 0) {

        lista.innerHTML =
        "Seu carrinho está vazio.";

        return;

    }


    let grupos = {};


    carrinho.forEach(function(item) {

        let detalhes =
        item.detalhes
        ? item.detalhes.join(", ")
        : "";


        let chave =
        item.nome +
        "|" +
        item.preco +
        "|" +
        detalhes;


        if (!grupos[chave]) {

            grupos[chave] = {

                nome: item.nome,

                preco: Number(item.preco),

                detalhes:
                item.detalhes || [],

                quantidade: 0

            };

        }


        grupos[chave].quantidade++;

    });


    let html = "";


    Object.values(grupos).forEach(
    function(item) {


        let subtotal =
        item.preco *
        item.quantidade;


        total += subtotal;


        html +=
        "<strong>" +
        item.quantidade +
        "x " +
        item.nome +
        "</strong>";


        if (
            item.detalhes &&
            item.detalhes.length > 0
        ) {

            html +=
            "<br><small>" +
            item.detalhes.join("<br>") +
            "</small>";

        }


        html +=
        "<br>R$ " +
        subtotal
        .toFixed(2)
        .replace(".", ",") +
        "<br><br>";

    });


    lista.innerHTML = html;


    document.getElementById(
        "totalPedido"
    ).innerHTML =
    "Total: R$ " +
    total
    .toFixed(2)
    .replace(".", ",");

}


// ==========================================
// ENVIAR PEDIDO
// ==========================================

function enviarPedido() {


    if (carrinho.length === 0) {

        alert(
            "Seu carrinho está vazio."
        );

        return;

    }


    let nome =
    document.getElementById(
        "nome"
    ).value.trim();


    let telefone =
    document.getElementById(
        "telefone"
    ).value.trim();


    let tipo =
    document.querySelector(
        'input[name="tipo"]:checked'
    ).value;


    if (!nome) {

        alert(
            "Digite seu nome."
        );

        return;

    }


    if (!telefone) {

        alert(
            "Digite seu telefone."
        );

        return;

    }


    let mensagem =
    "*NOVO PEDIDO - PASTELARIA EL SHADDAI*"
    + "\n\n";


    mensagem +=
    "*Cliente:* " +
    nome +
    "\n";


    mensagem +=
    "*Telefone:* " +
    telefone +
    "\n";


    mensagem +=
    "*Forma de recebimento:* " +
    tipo +
    "\n";


    if (tipo === "Entrega") {


        let rua =
        document.getElementById(
            "rua"
        ).value.trim();


        let numero =
        document.getElementById(
            "numero"
        ).value.trim();


        let complemento =
        document.getElementById(
            "complemento"
        ).value.trim();


        let referencia =
        document.getElementById(
            "referencia"
        ).value.trim();


        let bairro =
        document.getElementById(
            "bairro"
        ).value.trim();


        if (!rua || !numero || !bairro) {

            alert(
                "Preencha rua, número e bairro."
            );

            return;

        }


        mensagem +=
        "\n*ENDEREÇO DE ENTREGA*\n";


        mensagem +=
        "Rua: " +
        rua +
        "\n";


        mensagem +=
        "Número: " +
        numero +
        "\n";


        mensagem +=
        "Bairro: " +
        bairro +
        "\n";


        if (complemento) {

            mensagem +=
            "Complemento: " +
            complemento +
            "\n";

        }


        if (referencia) {

            mensagem +=
            "Referência: " +
            referencia +
            "\n";

        }

    }


    let observacao =
    document.getElementById(
        "observacao"
    ).value.trim();


    if (observacao) {

        mensagem +=
        "\n*Observações:*\n" +
        observacao +
        "\n";

    }


    mensagem +=
    "\n*PEDIDO:*\n";


    let total = 0;


    carrinho.forEach(function(item) {

        let preco =
        Number(item.preco);


        total += preco;


        mensagem +=
        "• " +
        item.nome;


        if (
            item.detalhes &&
            item.detalhes.length > 0
        ) {

            mensagem +=
            " (" +
            item.detalhes.join(", ") +
            ")";

        }


        mensagem +=
        " - R$ " +
        preco
        .toFixed(2)
        .replace(".", ",") +
        "\n";

    });


    mensagem +=
    "\n*TOTAL: R$ " +
    total
    .toFixed(2)
    .replace(".", ",") +
    "*";


    localStorage.removeItem(
        "carrinho"
    );


    window.open(

        "https://api.whatsapp.com/send?phone=5585988944421&text=" +
        encodeURIComponent(mensagem),

        "_blank"

    );


    window.location.href =
    "index.html";

}


// ==========================================
// INICIAR
// ==========================================

document.addEventListener(
    "DOMContentLoaded",
    function() {

        mostrarEndereco();

        mostrarResumo();

    }
);

</script>


</body>

</html>
