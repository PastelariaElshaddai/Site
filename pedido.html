<!DOCTYPE html>
<html lang="pt-BR">

<head>

<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width, initial-scale=1.0">

<title>Finalizar Pedido - Pastelaria El Shaddai</title>

<style>

* {
    box-sizing: border-box;
}

body {

    margin: 0;

    font-family: Arial, Helvetica, sans-serif;

    background: #fff8e1;

    color: #222;

}


/* =====================================
   CABEÇALHO
===================================== */

header {

    background: linear-gradient(
        135deg,
        #e53935,
        #ffb300
    );

    color: white;

    text-align: center;

    padding: 25px 20px;

    box-shadow:
        0 3px 10px rgba(0,0,0,0.15);

}


header h1 {

    margin: 0 0 8px;

    font-size: 28px;

}


header p {

    margin: 0;

    font-size: 16px;

}


/* =====================================
   CONTAINER
===================================== */

.container {

    width: 92%;

    max-width: 600px;

    margin: 25px auto;

    background: #ffffff;

    border-radius: 18px;

    padding: 22px;

    box-shadow:
        0 5px 20px rgba(0,0,0,0.12);

    border: 2px solid #ffb300;

}


/* =====================================
   TÍTULOS
===================================== */

h2 {

    color: #d84315;

    margin-top: 10px;

}


h3 {

    color: #e65100;

}


/* =====================================
   CAMPOS
===================================== */

.grupo {

    margin-bottom: 18px;

}


.grupo label {

    display: block;

    font-weight: bold;

    margin-bottom: 7px;

}


input,
textarea,
select {

    width: 100%;

    padding: 13px;

    border: 1px solid #ccc;

    border-radius: 9px;

    font-size: 16px;

    outline: none;

    background: #fffdf7;

}


input:focus,
textarea:focus,
select:focus {

    border-color: #ffb300;

    box-shadow:
        0 0 0 2px rgba(255,179,0,0.15);

}


textarea {

    min-height: 90px;

    resize: vertical;

}


/* =====================================
   ENTREGA / RETIRADA
===================================== */

.opcoes {

    display: flex;

    gap: 10px;

}


.opcao {

    flex: 1;

    border: 2px solid #ddd;

    border-radius: 10px;

    padding: 13px;

    text-align: center;

    cursor: pointer;

}


.opcao input {

    width: auto;

    margin-right: 5px;

}


/* =====================================
   ENDEREÇO
===================================== */

#areaEndereco {

    margin-top: 15px;

}


/* =====================================
   RESUMO
===================================== */

.resumo {

    margin-top: 25px;

    padding: 18px;

    background: #fff8e1;

    border: 1px solid #ffcc80;

    border-radius: 12px;

}


.resumo h3 {

    margin-top: 0;

}


#listaPedido {

    line-height: 1.6;

}


.item-resumo {

    padding: 12px 0;

    border-bottom: 1px solid #ffd180;

}


.item-resumo:last-child {

    border-bottom: none;

}


.nome-produto {

    font-size: 18px;

    font-weight: bold;

}


.detalhes-produto {

    margin-top: 5px;

    color: #555;

    font-size: 15px;

}


.preco-produto {

    margin-top: 5px;

    font-weight: bold;

}


.total {

    font-size: 22px;

    font-weight: bold;

    color: #d84315;

    margin-top: 15px;

}


/* =====================================
   BOTÃO
===================================== */

.botao-enviar {

    width: 100%;

    padding: 16px;

    margin-top: 20px;

    border: none;

    border-radius: 10px;

    background: linear-gradient(
        135deg,
        #e53935,
        #ffb300
    );

    color: white;

    font-size: 18px;

    font-weight: bold;

    cursor: pointer;

}


.botao-enviar:active {

    transform: scale(0.98);

}


/* =====================================
   VOLTAR
===================================== */

.botao-voltar {

    width: 100%;

    padding: 13px;

    margin-top: 10px;

    border: 1px solid #ddd;

    border-radius: 10px;

    background: white;

    color: #555;

    font-size: 16px;

    cursor: pointer;

}

</style>

</head>


<body>


<header>

<h1>Pastelaria El Shaddai</h1>

<p>Feito a dois, no ponto pra você!</p>

</header>


<div class="container">


<h2>Finalizar Pedido</h2>


<!-- =====================================
     DADOS DO CLIENTE
===================================== -->

<h3>Dados do cliente</h3>


<div class="grupo">

<label for="nome">
Nome
</label>

<input
type="text"
id="nome"
placeholder="Seu nome"
>

</div>


<div class="grupo">

<label for="telefone">
Telefone
</label>

<input
type="tel"
id="telefone"
placeholder="Seu telefone"
>

</div>


<!-- =====================================
     ENTREGA / RETIRADA
===================================== -->

<h3>
Como deseja receber?
</h3>


<div class="opcoes">


<label class="opcao">

<input
type="radio"
name="tipo"
value="Entrega"
checked
onchange="mostrarEndereco()"
>

Entrega

</label>


<label class="opcao">

<input
type="radio"
name="tipo"
value="Retirada"
onchange="mostrarEndereco()"
>

Retirada

</label>


</div>


<!-- =====================================
     ENDEREÇO
===================================== -->

<div id="areaEndereco">


<h3>
Endereço de entrega
</h3>


<div class="grupo">

<label for="rua">
Rua
</label>

<input
type="text"
id="rua"
placeholder="Nome da rua"
>

</div>


<div class="grupo">

<label for="numero">
Número
</label>

<input
type="text"
id="numero"
placeholder="Número"
>

</div>


<div class="grupo">

<label for="complemento">
Complemento
</label>

<input
type="text"
id="complemento"
placeholder="Casa, apartamento, bloco..."
>

</div>


<div class="grupo">

<label for="referencia">
Ponto de referência
</label>

<input
type="text"
id="referencia"
placeholder="Ex.: perto da praça"
>

</div>


<div class="grupo">

<label for="bairro">
Bairro
</label>

<input
type="text"
id="bairro"
placeholder="Seu bairro"
>

</div>


</div>


<!-- =====================================
     OBSERVAÇÕES
===================================== -->

<div class="grupo">

<label for="observacao">
Observações
</label>

<textarea
id="observacao"
placeholder="Alguma observação sobre seu pedido?"
></textarea>

</div>


<!-- =====================================
     RESUMO
===================================== -->

<div class="resumo">

<h3>
Resumo do pedido
</h3>


<div id="listaPedido">
Carregando pedido...
</div>


<div
class="total"
id="totalPedido">

Total: R$ 0,00

</div>

</div>


<!-- =====================================
     BOTÕES
===================================== -->

<button
class="botao-enviar"
onclick="enviarPedido()">

Enviar pedido pelo WhatsApp

</button>


<button
class="botao-voltar"
onclick="window.location.href='index.html'">

Voltar para o cardápio

</button>


</div>


<script>


// ==========================================
// CARRINHO
// ==========================================

let carrinho =
JSON.parse(
localStorage.getItem("carrinho")
) || [];


// ==========================================
// MOSTRAR / ESCONDER ENDEREÇO
// ==========================================

function mostrarEndereco() {

    const selecionado =
    document.querySelector(
        'input[name="tipo"]:checked'
    );


    if (!selecionado) return;


    const tipo =
    selecionado.value;


    const area =
    document.getElementById(
        "areaEndereco"
    );


    if (tipo === "Entrega") {

        area.style.display = "block";

    } else {

        area.style.display = "none";

    }

}


// ==========================================
// MOSTRAR RESUMO
// ==========================================

function mostrarResumo() {

    const lista =
    document.getElementById(
        "listaPedido"
    );


    const totalElemento =
    document.getElementById(
        "totalPedido"
    );


    let total = 0;


    if (carrinho.length === 0) {

        lista.innerHTML =
        "Seu carrinho está vazio.";

        totalElemento.innerHTML =
        "Total: R$ 0,00";

        return;

    }


    let html = "";


    carrinho.forEach(function(item) {


        // ==================================
        // QUANTIDADE REAL
        // ==================================

        const quantidade =
        Number(item.quantidade || 1);


        // ==================================
        // PREÇO UNITÁRIO
        // ==================================

        const precoUnitario =
        Number(item.preco || 0);


        // ==================================
        // SUBTOTAL
        // ==================================

        const subtotal =
        precoUnitario * quantidade;


        total += subtotal;


        // ==================================
        // NOME
        // ==================================

        html += `
        
            <div class="item-resumo">

                <div class="nome-produto">
                    ${quantidade}x ${item.nome}
                </div>
        `;


        // ==================================
        // DETALHES
        // ==================================

        if (
            item.detalhes &&
            item.detalhes.length > 0
        ) {

            html += `
            
                <div class="detalhes-produto">

                    ${item.detalhes.join("<br>")}

                </div>
            
            `;

        }


        // ==================================
        // PREÇO
        // ==================================

        html += `
        
                <div class="preco-produto">

                    R$ ${precoUnitario
                        .toFixed(2)
                        .replace(".", ",")
                    }
                    cada

                    <br>

                    Subtotal:
                    R$ ${subtotal
                        .toFixed(2)
                        .replace(".", ",")
                    }

                </div>

            </div>
        
        `;

    });


    lista.innerHTML =
    html;


    totalElemento.innerHTML =
    "Total: R$ " +
    total
    .toFixed(2)
    .replace(".", ",");

}


// ==========================================
// ENVIAR PEDIDO
// ==========================================

function enviarPedido() {


    // ======================================
    // VERIFICAR CARRINHO
    // ======================================

    if (carrinho.length === 0) {

        alert(
            "Seu carrinho está vazio."
        );

        return;

    }


    // ======================================
    // DADOS DO CLIENTE
    // ======================================

    const nome =
    document.getElementById(
        "nome"
    ).value.trim();


    const telefone =
    document.getElementById(
        "telefone"
    ).value.trim();


    const tipoSelecionado =
    document.querySelector(
        'input[name="tipo"]:checked'
    );


    if (!tipoSelecionado) {

        alert(
            "Escolha entrega ou retirada."
        );

        return;

    }


    const tipo =
    tipoSelecionado.value;


    // ======================================
    // VALIDAR NOME
    // ======================================

    if (!nome) {

        alert(
            "Digite seu nome."
        );

        return;

    }


    // ======================================
    // VALIDAR TELEFONE
    // ======================================

    if (!telefone) {

        alert(
            "Digite seu telefone."
        );

        return;

    }


    // ======================================
    // COMEÇAR MENSAGEM
    // ======================================

    let mensagem =
    "*NOVO PEDIDO - PASTELARIA EL SHADDAI*"
    + "\n\n";


    mensagem +=
    "*Cliente:* " +
    nome +
    "\n";


    mensagem +=
    "*Telefone:* " +
    telefone +
    "\n";


    mensagem +=
    "*Forma de recebimento:* " +
    tipo +
    "\n";


    // ======================================
    // ENDEREÇO
    // ======================================

    if (tipo === "Entrega") {


        const rua =
        document.getElementById(
            "rua"
        ).value.trim();


        const numero =
        document.getElementById(
            "numero"
        ).value.trim();


        const complemento =
        document.getElementById(
            "complemento"
        ).value.trim();


        const referencia =
        document.getElementById(
            "referencia"
        ).value.trim();


        const bairro =
        document.getElementById(
            "bairro"
        ).value.trim();


        if (
            !rua ||
            !numero ||
            !bairro
        ) {

            alert(
                "Preencha rua, número e bairro."
            );

            return;

        }


        mensagem +=
        "\n*ENDEREÇO DE ENTREGA*\n";


        mensagem +=
        "Rua: " +
        rua +
        "\n";


        mensagem +=
        "Número: " +
        numero +
        "\n";


        mensagem +=
        "Bairro: " +
        bairro +
        "\n";


        if (complemento) {

            mensagem +=
            "Complemento: " +
            complemento +
            "\n";

        }


        if (referencia) {

            mensagem +=
            "Referência: " +
            referencia +
            "\n";

        }

    }


    // ======================================
    // OBSERVAÇÃO
    // ======================================

    const observacao =
    document.getElementById(
        "observacao"
    ).value.trim();


    if (observacao) {

        mensagem +=
        "\n*Observações:*\n" +
        observacao +
        "\n";

    }


    // ======================================
    // PEDIDO
    // ======================================

    mensagem +=
    "\n*PEDIDO:*\n";


    let total = 0;


    carrinho.forEach(function(item) {


        // ==================================
        // QUANTIDADE REAL
        // ==================================

        const quantidade =
        Number(item.quantidade || 1);


        // ==================================
        // PREÇO UNITÁRIO
        // ==================================

        const preco =
        Number(item.preco || 0);


        // ==================================
        // SUBTOTAL
        // ==================================

        const subtotal =
        preco * quantidade;


        total += subtotal;


        // ==================================
        // PRODUTO
        // ==================================

        mensagem +=
        "\n• " +
        quantidade +
        "x " +
        item.nome;


        // ==================================
        // DETALHES
        // ==================================

        if (
            item.detalhes &&
            item.detalhes.length > 0
        ) {

            item.detalhes.forEach(
            function(detalhe) {

                mensagem +=
                "\n   " +
                detalhe;

            });

        }


        // ==================================
        // PREÇO
        // ==================================

        mensagem +=
        "\n   R$ " +
        preco
        .toFixed(2)
        .replace(".", ",") +
        " cada";


        mensagem +=
        "\n   Subtotal: R$ " +
        subtotal
        .toFixed(2)
        .replace(".", ",") +
        "\n";

    });


    // ======================================
    // TOTAL FINAL
    // ======================================

    mensagem +=
    "\n*TOTAL: R$ " +
    total
    .toFixed(2)
    .replace(".", ",") +
    "*";


    // ======================================
    // ABRIR WHATSAPP
    // ======================================

    const url =
    "https://api.whatsapp.com/send?phone=5585988944421&text=" +
    encodeURIComponent(mensagem);


    window.open(
        url,
        "_blank"
    );


    // ======================================
    // LIMPAR CARRINHO
    // ======================================

    localStorage.removeItem(
        "carrinho"
    );


    // ======================================
    // VOLTAR AO CARDÁPIO
    // ======================================

    window.location.href =
    "index.html";

}


// ==========================================
// INICIAR
// ==========================================

document.addEventListener(
    "DOMContentLoaded",
    function() {

        mostrarEndereco();

        mostrarResumo();

    }
);

</script>


</body>

</html>
