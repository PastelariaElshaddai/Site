<!DOCTYPE html>
<html lang="pt-BR">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Finalizar Pedido - Pastelaria El Shaddai</title>

<style>

* {
    box-sizing: border-box;
}

body {
    margin: 0;
    font-family: Arial, sans-serif;
    background: #fff8e7;
    color: #222;
}

header {
    background: linear-gradient(135deg, #d92323, #ffb300);
    color: white;
    text-align: center;
    padding: 25px 15px;
}

header h1 {
    margin: 0;
    font-size: 28px;
}

header p {
    margin: 8px 0 0;
    font-size: 16px;
}

.container-pedido {
    width: 92%;
    max-width: 600px;
    margin: 25px auto 40px;
}

.card {
    background: white;
    padding: 22px;
    margin-bottom: 18px;
    border-radius: 16px;
    box-shadow: 0 3px 12px rgba(0,0,0,0.10);
}

.card h2 {
    margin-top: 0;
    color: #c62828;
    font-size: 22px;
}

label {
    display: block;
    font-weight: bold;
    margin-top: 15px;
    margin-bottom: 6px;
}

input,
select,
textarea {
    width: 100%;
    padding: 13px;
    border: 1px solid #ccc;
    border-radius: 9px;
    font-size: 16px;
    background: white;
}

textarea {
    min-height: 80px;
    resize: vertical;
}

.opcoes {
    display: flex;
    gap: 15px;
    margin-top: 10px;
}

.opcao {
    flex: 1;
    border: 2px solid #ddd;
    padding: 13px;
    border-radius: 10px;
    cursor: pointer;
    text-align: center;
    font-weight: bold;
}

.opcao input {
    width: auto;
    margin-right: 6px;
}

#areaEntrega {
    margin-top: 10px;
}

.salvar {
    display: flex;
    align-items: center;
    gap: 8px;
    margin-top: 18px;
    font-weight: normal;
}

.salvar input {
    width: auto;
}

.item-pedido {
    display: flex;
    justify-content: space-between;
    gap: 10px;
    padding: 10px 0;
    border-bottom: 1px solid #eee;
}

.resumo-linha {
    display: flex;
    justify-content: space-between;
    margin-top: 12px;
}

.total {
    display: flex;
    justify-content: space-between;
    margin-top: 18px;
    padding-top: 15px;
    border-top: 2px solid #ddd;
    font-size: 22px;
    font-weight: bold;
    color: #c62828;
}

.botao-enviar {
    width: 100%;
    border: none;
    padding: 16px;
    border-radius: 10px;
    background: #ffb300;
    color: #222;
    font-size: 19px;
    font-weight: bold;
    cursor: pointer;
}

.botao-voltar {
    width: 100%;
    margin-top: 10px;
    padding: 13px;
    border-radius: 10px;
    border: 1px solid #ccc;
    background: white;
    font-size: 16px;
}

.aviso {
    font-size: 14px;
    color: #666;
    margin-top: 8px;
}

</style>

</head>


<body>


<header>

<h1>Pastelaria El Shaddai</h1>

<p>Finalizar pedido</p>

</header>


<div class="container-pedido">


<!-- DADOS DO CLIENTE -->

<div class="card">

<h2>Dados do cliente</h2>


<label for="nome">
Nome
</label>

<input
type="text"
id="nome"
placeholder="Seu nome"
>


<label for="telefone">
Telefone
</label>

<input
type="tel"
id="telefone"
placeholder="Seu telefone"
>


<label class="salvar">

<input
type="checkbox"
id="salvarDados"
>

Salvar meus dados para próximos pedidos

</label>

</div>


<!-- ENTREGA OU RETIRADA -->

<div class="card">

<h2>Como deseja receber?</h2>


<div class="opcoes">

<label class="opcao">

<input
type="radio"
name="tipo"
value="Entrega"
checked
onchange="mostrarEntrega()"
>

Entrega

</label>


<label class="opcao">

<input
type="radio"
name="tipo"
value="Retirada"
onchange="mostrarEntrega()"
>

Retirada

</label>

</div>


<div id="areaEntrega">


<label for="bairro">
Bairro
</label>

<select id="bairro" onchange="calcularTaxa()">

<option value="">
Selecione seu bairro
</option>

<!-- TAXAS DE TESTE -->

<option value="5">
Centro - R$ 5,00
</option>

<option value="6">
Jereissati - R$ 6,00
</option>

<option value="7">
Nova Metrópole - R$ 7,00
</option>

<option value="8">
Outro bairro - R$ 8,00
</option>

</select>

<p class="aviso">
As taxas acima são apenas para teste. Depois colocaremos seus bairros e valores reais.
</p>


<label for="rua">
Rua
</label>

<input
type="text"
id="rua"
placeholder="Nome da rua"
>


<label for="numero">
Número
</label>

<input
type="text"
id="numero"
placeholder="Número da casa"
>


<label for="complemento">
Complemento
</label>

<input
type="text"
id="complemento"
placeholder="Casa, apartamento, bloco..."
>


<label for="referencia">
Ponto de referência
</label>

<input
type="text"
id="referencia"
placeholder="Ex.: perto da praça"
>

</div>

</div>


<!-- OBSERVAÇÕES -->

<div class="card">

<h2>Observações</h2>

<textarea
id="observacao"
placeholder="Alguma observação sobre seu pedido?"
></textarea>

</div>


<!-- RESUMO -->

<div class="card">

<h2>Resumo do pedido</h2>

<div id="listaPedido"></div>


<div class="resumo-linha">

<span>Subtotal</span>

<strong id="subtotal">
R$ 0,00
</strong>

</div>


<div class="resumo-linha">

<span>Taxa de entrega</span>

<strong id="taxa">
R$ 0,00
</strong>

</div>


<div class="total">

<span>Total</span>

<span id="total">
R$ 0,00
</span>

</div>

</div>


<!-- BOTÕES -->

<div class="card">

<button
class="botao-enviar"
onclick="enviarPedido()"
>

Enviar pedido

</button>


<button
class="botao-voltar"
onclick="window.location.href='index.html'"
>

Voltar para o cardápio

</button>

</div>


</div>


<script>


// ===============================
// CARRINHO
// ===============================

let carrinho =
JSON.parse(
localStorage.getItem("carrinho")
) || [];


// ===============================
// MOSTRAR ENTREGA
// ===============================

function mostrarEntrega() {

    let tipo =
    document.querySelector(
        'input[name="tipo"]:checked'
    ).value;

    let area =
    document.getElementById("areaEntrega");


    if (tipo === "Entrega") {

        area.style.display = "block";

    } else {

        area.style.display = "none";

        document.getElementById("taxa").innerText =
        "R$ 0,00";

        atualizarTotal();

    }

}


// ===============================
// CALCULAR TAXA
// ===============================

function calcularTaxa() {

    let tipo =
    document.querySelector(
        'input[name="tipo"]:checked'
    ).value;


    if (tipo !== "Entrega") {

        document.getElementById("taxa").innerText =
        "R$ 0,00";

        atualizarTotal();

        return;
    }


    let bairro =
    document.getElementById("bairro").value;


    let taxa =
    Number(bairro || 0);


    document.getElementById("taxa").innerText =
    "R$ " + taxa.toFixed(2).replace(".", ",");


    atualizarTotal();

}


// ===============================
// MOSTRAR CARRINHO
// ===============================

function mostrarPedido() {

    let lista =
    document.getElementById("listaPedido");

    lista.innerHTML = "";


    let subtotal = 0;


    carrinho.forEach(item => {

        let preco =
        Number(item.preco);


        subtotal += preco;


        let div =
        document.createElement("div");


        div.className =
        "item-pedido";


        div.innerHTML = `
            <span>${item.nome}</span>
            <strong>R$ ${preco.toFixed(2).replace(".", ",")}</strong>
        `;


        lista.appendChild(div);

    });


    document.getElementById("subtotal").innerText =
    "R$ " +
    subtotal.toFixed(2).replace(".", ",");


    atualizarTotal();

}


// ===============================
// ATUALIZAR TOTAL
// ===============================

function atualizarTotal() {

    let subtotal = 0;


    carrinho.forEach(item => {

        subtotal += Number(item.preco);

    });


    let tipo =
    document.querySelector(
        'input[name="tipo"]:checked'
    ).value;


    let taxa = 0;


    if (tipo === "Entrega") {

        taxa =
        Number(
            document.getElementById("bairro").value || 0
        );

    }


    let total =
    subtotal + taxa;


    document.getElementById("total").innerText =
    "R$ " +
    total.toFixed(2).replace(".", ",");

}


// ===============================
// SALVAR DADOS
// ===============================

function salvarDadosCliente() {

    let dados = {

        nome:
        document.getElementById("nome").value,

        telefone:
        document.getElementById("telefone").value,

        bairro:
        document.getElementById("bairro").value,

        rua:
        document.getElementById("rua").value,

        numero:
        document.getElementById("numero").value,

        complemento:
        document.getElementById("complemento").value,

        referencia:
        document.getElementById("referencia").value

    };


    localStorage.setItem(
        "dadosCliente",
        JSON.stringify(dados)
    );

}


// ===============================
// CARREGAR DADOS SALVOS
// ===============================

function carregarDadosCliente() {

    let dados =
    JSON.parse(
        localStorage.getItem("dadosCliente")
    );


    if (!dados) {

        return;

    }


    document.getElementById("nome").value =
    dados.nome || "";


    document.getElementById("telefone").value =
    dados.telefone || "";


    document.getElementById("bairro").value =
    dados.bairro || "";


    document.getElementById("rua").value =
    dados.rua || "";


    document.getElementById("numero").value =
    dados.numero || "";


    document.getElementById("complemento").value =
    dados.complemento || "";


    document.getElementById("referencia").value =
    dados.referencia || "";


    calcularTaxa();

}


// ===============================
// ENVIAR PEDIDO
// ===============================

function enviarPedido() {


    if (carrinho.length === 0) {

        alert("Seu carrinho está vazio.");

        return;

    }


    let nome =
    document.getElementById("nome").value.trim();


    let telefone =
    document.getElementById("telefone").value.trim();


    if (!nome || !telefone) {

        alert(
            "Preencha seu nome e telefone."
        );

        return;

    }


    let tipo =
    document.querySelector(
        'input[name="tipo"]:checked'
    ).value;


    let bairro = "";

    let rua = "";

    let numero = "";

    let complemento = "";

    let referencia = "";

    let taxa = 0;


    if (tipo === "Entrega") {

        bairro =
        document.getElementById("bairro").options[
            document.getElementById("bairro").selectedIndex
        ].text;


        taxa =
        Number(
            document.getElementById("bairro").value || 0
        );


        rua =
        document.getElementById("rua").value.trim();


        numero =
        document.getElementById("numero").value.trim();


        complemento =
        document.getElementById("complemento").value.trim();


        referencia =
        document.getElementById("referencia").value.trim();


        if (!document.getElementById("bairro").value) {

            alert("Selecione seu bairro.");

            return;

        }


        if (!rua || !numero) {

            alert(
                "Preencha a rua e o número."
            );

            return;

        }

    }


    let observacao =
    document.getElementById("observacao").value.trim();


    let subtotal = 0;

    let pedidos = "";


    carrinho.forEach(item => {

        let preco =
        Number(item.preco);


        subtotal += preco;


        pedidos +=
        "• " +
        item.nome +
        " - R$ " +
        preco.toFixed(2) +
        "\n";

    });


    let total =
    subtotal + taxa;


    let mensagem =
    "*NOVO PEDIDO - PASTELARIA EL SHADDAI*\n\n";


    mensagem +=
    "Nome: " +
    nome +
    "\n";


    mensagem +=
    "Telefone: " +
    telefone +
    "\n\n";


    mensagem +=
    "Tipo: " +
    tipo +
    "\n";


    if (tipo === "Entrega") {

        mensagem +=
        "Bairro: " +
        bairro +
        "\n";


        mensagem +=
        "Rua: " +
        rua +
        "\n";


        mensagem +=
        "Número: " +
        numero +
        "\n";


        if (complemento) {

            mensagem +=
            "Complemento: " +
            complemento +
            "\n";

        }


        if (referencia) {

            mensagem +=
            "Referência: " +
            referencia +
            "\n";

        }


        mensagem +=
        "Taxa de entrega: R$ " +
        taxa.toFixed(2) +
        "\n";

    }


    mensagem +=
    "\n*PEDIDO:*\n" +
    pedidos;


    mensagem +=
    "\nSubtotal: R$ " +
    subtotal.toFixed(2);


    mensagem +=
    "\nTaxa: R$ " +
    taxa.toFixed(2);


    mensagem +=
    "\n*TOTAL: R$ " +
    total.toFixed(2) +
    "*";


    if (observacao) {

        mensagem +=
        "\n\nObservações:\n" +
        observacao;

    }


    // SALVAR DADOS SE MARCADO

    if (
        document.getElementById("salvarDados").checked
    ) {

        salvarDadosCliente();

    }


    // ==================================
    // COLOQUE SEU WHATSAPP AQUI
    // ==================================

    let numeroWhatsApp =
    "5585988944421";


    let url =
    "https://wa.me/" +
    numeroWhatsApp +
    "?text=" +
    encodeURIComponent(mensagem);


    localStorage.removeItem("carrinho");


    window.location.href = url;

}


// ===============================
// INICIAR PÁGINA
// ===============================

carregarDadosCliente();

mostrarPedido();

mostrarEntrega();

</script>


</body>

    </html>
