<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Finalizar Pedido</title>
</head>

<body>

<h1>🍴 Finalizar Pedido</h1>

<p>Nome:</p>
<input type="text" id="nome">

<p>Telefone:</p>
<input type="tel" id="telefone">

<p>Como deseja receber?</p>

<label>
<input type="radio" name="tipo" value="Entrega" checked>
Entrega
</label>

<label>
<input type="radio" name="tipo" value="Retirada">
Retirada
</label>

<p>Endereço:</p>
<textarea id="endereco"></textarea>

<p>Observações:</p>
<textarea id="observacao"></textarea>

<br><br>

<button onclick="enviarPedido()">Enviar para WhatsApp</button>
<script>
let carrinho = JSON.parse(localStorage.getItem("carrinho")) || [];
    function enviarPedido() {

    let nome = document.getElementById("nome").value;
    let telefone = document.getElementById("telefone").value;
    let tipo = document.querySelector('input[name="tipo"]:checked').value;
    let endereco = document.getElementById("endereco").value;
    let observacao = document.getElementById("observacao").value;
let pedidos = "";

carrinho.forEach(item => {
    pedidos += `• ${item.nome} - R$ ${item.preco}\n`;
});
    let mensagem =
`🍴 *Novo Pedido - Pastelaria El Shaddai*

👤 Nome: ${nome}
📞 Telefone: ${telefone}
🚚 Tipo: ${tipo}
📍 Endereço: ${endereco}

📝 Observações:
${observacao}`;

    window.open(
        "https://wa.me/5585988944421?text=" + encodeURIComponent(mensagem),
        "_blank"
    );
}
</script>
</body>
</html>
