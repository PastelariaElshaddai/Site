<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Finalizar Pedido</title>
</head>

<body>

<h1>🍴 Finalizar Pedido</h1>

<p>Nome:</p>
<input type="text" id="nome">

<p>Telefone:</p>
<input type="tel" id="telefone">

<p>Como deseja receber?</p>

<label>
<input type="radio" name="tipo" value="Entrega" checked>
Entrega
</label>

<label>
<input type="radio" name="tipo" value="Retirada">
Retirada
</label>

<p>Endereço:</p>
<textarea id="endereco"></textarea>

<p>Observações:</p>
<textarea id="observacao"></textarea>

<br><br>

<button onclick="enviarPedido()">📦 Enviar Pedido</button>

<script>

let carrinho = JSON.parse(localStorage.getItem("carrinho")) || [];

function enviarPedido() {

    let nome = document.getElementById("nome").value;
    let telefone = document.getElementById("telefone").value;
    let tipo = document.querySelector('input[name="tipo"]:checked').value;
    let endereco = document.getElementById("endereco").value;
    let observacao = document.getElementById("observacao").value;

    let pedidos = "";
let total = 0;
    carrinho.forEach(item => {
    pedidos += "• " + item.nome + " - R$ " + item.preco + "\n";
    total += Number(item.preco);
});

    let mensagem =
"*Novo Pedido - Pastelaria El Shaddai*\n\n" +
"👤 Nome: " + nome + "\n" +
"📞 Telefone: " + telefone + "\n" +
"🚚 Tipo: " + tipo + "\n" +
"📍 Endereço: " + endereco + "\n\n" +
"📝 Observações:\n" +
observacao + "\n\n" +
"🛒 Pedido:\n" +
pedidos +
"\n💰 Total: R$ " + total.toFixed(2);
    window.open(
        "https://api.whatsapp.com/send?phone=5585988944421&text=" + encodeURIComponent(mensagem),
        "_blank"
    );

    localStorage.removeItem("carrinho");

}

</script>

</body>
</html>
