<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Painel El Shaddai</title><link rel="stylesheet" href="admin.css"></head><body><div class="app"><aside class="side"><h1>El Shaddai</h1><p>Painel administrativo</p><nav><button class="active" data-s="inicio"><span class="label">Início</span></button><button data-s="produtos"><span class="label">Produtos</span></button><button data-s="categorias"><span class="label">Categorias</span></button><button data-s="aparencia"><span class="label">Aparência</span></button><button data-s="promocoes"><span class="label">Promoções</span></button><button data-s="entrega"><span class="label">Entrega</span></button><button data-s="pagamentos"><span class="label">Pagamentos</span></button><button data-s="whatsapp"><span class="label">WhatsApp</span></button><button data-s="pedidos"><span class="label">Pedidos</span></button><button data-s="clientes"><span class="label">Clientes</span></button><button data-s="vendas"><span class="label">Vendas</span></button><button data-s="configuracoes"><span class="label">Configurações</span></button></nav></aside><main class="main">
<section id="inicio" class="screen active"><div class="card"><h2>Pastelaria El Shaddai</h2><p>Feito a dois, no ponto pra você!</p></div></section>
<section id="produtos" class="screen"><div class="card"><button class="btn primary" id="novoProduto">+ Adicionar produto</button></div><div class="card hidden" id="formProduto"><input id="produtoId" type="hidden"><div class="field"><label>Nome</label><input id="nomeProduto"></div><div class="row"><div class="field"><label>Preço</label><input id="precoProduto" type="number" step="0.01"></div><div class="field"><label>Categoria</label><select id="categoriaProduto"></select></div></div><div class="field"><label>Descrição</label><textarea id="descricaoProduto"></textarea></div><div class="field"><label>Foto</label><input id="fotoProduto" type="file"></div><label><input id="produtoAtivo" type="checkbox" checked> Produto ativo</label><div class="actions"><button class="btn primary" id="salvarProduto">Salvar</button><button class="btn secondary" id="cancelarProduto">Cancelar</button></div></div><div id="listaProdutos" class="grid"></div></section>
<section id="categorias" class="screen"><div class="card"><button class="btn primary" id="novaCategoria">+ Adicionar categoria</button></div><div class="card hidden" id="formCategoria"><input id="categoriaId" type="hidden"><div class="field"><label>Nome</label><input id="nomeCategoria"></div><div class="field"><label>Descrição</label><textarea id="descricaoCategoria"></textarea></div><label><input id="categoriaAtiva" type="checkbox" checked> Categoria ativa</label><div class="actions"><button class="btn primary" id="salvarCategoria">Salvar</button><button class="btn secondary" id="cancelarCategoria">Cancelar</button></div></div><div id="listaCategorias" class="grid"></div></section>
<section id="aparencia" class="screen"><div class="card"><h2>Aparência</h2><div class="field"><label>Nome da loja</label><input value="Pastelaria El Shaddai"></div><div class="field"><label>Slogan</label><input value="Feito a dois, no ponto pra você!"></div></div></section>
<section id="promocoes" class="screen"><div class="card"><h2>Promoções</h2><div class="field"><label>Título</label><input></div><div class="field"><label>Descrição</label><textarea></textarea></div></div></section>
<section id="entrega" class="screen"><div class="card"><h2>Entrega</h2><p class="muted">Taxa por bairro ou por km.</p><div class="row"><div class="field"><label>Modo</label><select id="modoEntrega"><option value="bairro">Por bairro</option><option value="km">Por km</option></select></div><div class="field"><label id="nomeTaxa">Bairro</label><input id="valorArea"></div></div><div class="field"><label>Taxa</label><input id="valorTaxa" type="number" step="0.01"></div><button class="btn primary" id="addTaxa">Adicionar taxa</button><div id="listaTaxas"></div></div></section>
<section id="pagamentos" class="screen"><div class="card"><h2>Pagamentos</h2><label><input type="checkbox" checked> Pix</label><br><label><input type="checkbox" checked> Cartão</label><br><label><input type="checkbox" checked> Dinheiro</label></div></section>
<section id="whatsapp" class="screen"><div class="card"><h2>WhatsApp</h2><input placeholder="5585..."></div></section>
<section id="pedidos" class="screen"><div class="card"><h2>Pedidos</h2><p>Aceitar, recusar e notificações serão conectados ao checkout.</p></div></section>
<section id="clientes" class="screen"><div class="card"><h2>Clientes</h2></div></section><section id="vendas" class="screen"><div class="card"><h2>Vendas</h2></div></section><section id="configuracoes" class="screen"><div class="card"><h2>Configurações</h2></div></section>
</main></div><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="supabase.js"></script><script src="admin.js"></script></body></html>
