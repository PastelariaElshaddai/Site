<!DOCTYPE html>
<html lang="pt-BR">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Painel El Shaddai</title>

    <link rel="stylesheet" href="admin.css">

</head>


<body>


<!-- =========================================
     PAINEL
========================================= -->

<div class="painel">


    <!-- MENU LATERAL -->

    <aside class="menu">

        <div class="menu-logo">

            <div class="icone-logo">
                🥟
            </div>

            <h1>
                El Shaddai
            </h1>

            <p>
                Painel administrativo
            </p>

        </div>


        <nav>

            <button class="menu-item ativo">
                🏠
                <span>Início</span>
            </button>


            <button class="menu-item">
                🍴
                <span>Produtos</span>
            </button>


            <button class="menu-item">
                📂
                <span>Categorias</span>
            </button>


            <button class="menu-item">
                🖼️
                <span>Aparência</span>
            </button>


            <button class="menu-item">
                🎁
                <span>Promoções</span>
            </button>


            <button class="menu-item">
                🚚
                <span>Entrega</span>
            </button>


            <button class="menu-item">
                💳
                <span>Pagamentos</span>
            </button>


            <button class="menu-item">
                📱
                <span>WhatsApp</span>
            </button>


            <button class="menu-item">
                📋
                <span>Pedidos</span>
            </button>


            <button class="menu-item">
                👥
                <span>Clientes</span>
            </button>


            <button class="menu-item">
                📊
                <span>Vendas</span>
            </button>


            <button class="menu-item">
                ⚙️
                <span>Configurações</span>
            </button>

        </nav>

    </aside>



    <!-- CONTEÚDO -->

    <main class="conteudo">


        <header class="topo-painel">

            <div>

                <h2>
                    Painel administrativo
                </h2>

                <p>
                    Pastelaria El Shaddai
                </p>

            </div>


            <div class="status-loja">

                <span class="bolinha"></span>

                Loja aberta

            </div>

        </header>



        <!-- ÁREA PRINCIPAL -->

        <section class="inicio">


            <div class="boas-vindas">

                <h1>
                    Olá! 👋
                </h1>

                <p>
                    Aqui você poderá administrar
                    sua plataforma sem precisar
                    mexer no código.
                </p>

            </div>



            <!-- CARDS -->

            <div class="resumo">


                <div class="card-resumo">

                    <span class="card-icone">
                        🍴
                    </span>

                    <div>

                        <strong>
                            0
                        </strong>

                        <p>
                            Produtos
                        </p>

                    </div>

                </div>



                <div class="card-resumo">

                    <span class="card-icone">
                        📋
                    </span>

                    <div>

                        <strong>
                            0
                        </strong>

                        <p>
                            Pedidos hoje
                        </p>

                    </div>

                </div>



                <div class="card-resumo">

                    <span class="card-icone">
                        💰
                    </span>

                    <div>

                        <strong>
                            R$ 0,00
                        </strong>

                        <p>
                            Vendas hoje
                        </p>

                    </div>

                </div>



                <div class="card-resumo">

                    <span class="card-icone">
                        👥
                    </span>

                    <div>

                        <strong>
                            0
                        </strong>

                        <p>
                            Clientes
                        </p>

                    </div>

                </div>

            </div>



            <!-- ACESSO RÁPIDO -->

            <div class="bloco">

                <div class="bloco-titulo">

                    <div>

                        <h2>
                            Acesso rápido
                        </h2>

                        <p>
                            Comece configurando sua loja.
                        </p>

                    </div>

                </div>


                <div class="atalhos">


                    <button class="atalho">

                        <span>
                            🍴
                        </span>

                        <strong>
                            Adicionar produto
                        </strong>

                        <small>
                            Cadastre seus produtos
                        </small>

                    </button>



                    <button class="atalho">

                        <span>
                            📂
                        </span>

                        <strong>
                            Criar categoria
                        </strong>

                        <small>
                            Organize seu cardápio
                        </small>

                    </button>



                    <button class="atalho">

                        <span>
                            🖼️
                        </span>

                        <strong>
                            Personalizar loja
                        </strong>

                        <small>
                            Logo, banner e aparência
                        </small>

                    </button>



                    <button class="atalho">

                        <span>
                            📱
                        </span>

                        <strong>
                            Configurar WhatsApp
                        </strong>

                        <small>
                            Receba seus pedidos
                        </small>

                    </button>


                </div>

            </div>


        </section>


    </main>

</div>


</body>

              </html>
